<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <meta name="description" content="老人言程序制作有限公司内部管理台：经营数据、合作方、资金、客户、服务与团队、股市行情。">
  <link rel="icon" href="data:,">
  <title>老人言 · 公司管理台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#mainContent">跳到主要内容</a>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <div class="brand">
        <div class="brand-name">老人言传媒</div>
        <div class="brand-sub"></div>
      </div>

      <nav class="nav" aria-label="页面">
        <div class="nav-group">
          <div class="nav-label">经营</div>
          <button class="nav-item" type="button" data-nav="dashboard">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#i-grid"></use></svg></span>
            <span>数据看板</span>
          </button>
        </div>
        <div class="nav-group">
          <div class="nav-label">协作</div>
          <button class="nav-item" type="button" data-nav="partners">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#i-building"></use></svg></span>
            <span>合作与集团</span>
          </button>
          <button class="nav-item" type="button" data-nav="clients">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#i-users"></use></svg></span>
            <span>客户信息</span>
          </button>
        </div>
        <div class="nav-group">
          <div class="nav-label">资金</div>
          <button class="nav-item" type="button" data-nav="funds">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#i-transfer"></use></svg></span>
            <span>存入与转出</span>
          </button>
        </div>
        <div class="nav-group">
          <div class="nav-label">组织</div>
          <button class="nav-item" type="button" data-nav="team">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#i-layers"></use></svg></span>
            <span>服务与团队</span>
          </button>
        </div>
        <div class="nav-group">
          <div class="nav-label">市场</div>
          <button class="nav-item" type="button" data-nav="stocks">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#i-chart"></use></svg></span>
            <span>股市数据</span>
          </button>
        </div>
      </nav>

      <div class="sidebar-foot">
        <div class="principal">
          <div class="principal-avatar" aria-hidden="true">炎</div>
          <div class="principal-copy">
            <div class="principal-name">老人炎</div>
            <div class="principal-role">董事长 · 负责人</div>
          </div>
          <span class="online-dot" title="在线"></span>
        </div>
        <div class="sidebar-meta">
          <span class="meta-status"><span class="status-dot"></span>系统运行正常</span>
          <span class="meta-version">v1.0</span>
        </div>
      </div>
    </aside>

    <div class="sidebar-scrim" id="sidebarScrim" hidden></div>

    <div class="app-main">
      <header class="topbar">
        <button class="icon-btn mobile-menu" id="mobileMenu" type="button" aria-label="打开导航" aria-expanded="false" aria-controls="sidebar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-menu"></use></svg>
        </button>

        <div class="search-wrap" id="searchWrap">
          <div class="search-field" id="searchField">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"></use></svg>
            <input id="globalSearch" type="search" placeholder="搜索公司、客户、交易、员工…" autocomplete="off" spellcheck="false" aria-label="全局搜索" aria-expanded="false" aria-controls="searchPanel" role="combobox">
            <kbd class="search-kbd" id="searchKbd">⌘ K</kbd>
          </div>
          <div class="search-panel" id="searchPanel" hidden></div>
        </div>

        <div class="topbar-right">
          <div class="topbar-date" id="topbarDate"></div>

          <div class="popover-wrap">
            <button class="icon-btn has-badge" id="notifBtn" type="button" aria-label="通知" aria-expanded="false" aria-controls="notifPanel">
              <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-bell"></use></svg>
              <span class="badge" id="notifBadge">3</span>
            </button>
            <div class="popover notif-panel" id="notifPanel" hidden>
              <div class="popover-head">
                <div>
                  <div class="popover-title">通知</div>
                  <div class="popover-sub" id="notifSub">3 条未读</div>
                </div>
                <button class="text-btn" type="button" data-action="read-all-notifications">全部已读</button>
              </div>
              <div class="notif-list" id="notifList"></div>
            </div>
          </div>

          <div class="popover-wrap">
            <button class="user-chip" id="userBtn" type="button" aria-label="账户菜单" aria-expanded="false" aria-controls="userPanel">
              <span class="user-avatar" aria-hidden="true">炎</span>
              <span class="user-copy">
                <span class="user-name">老人炎</span>
                <span class="user-role">董事长</span>
              </span>
              <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chevron"></use></svg>
            </button>
            <div class="popover user-panel" id="userPanel" hidden>
              <div class="user-panel-head">
                <div class="avatar lg" aria-hidden="true">炎</div>
                <div>
                  <div class="user-panel-name">老人炎</div>
                  <div class="user-panel-role">董事长 · 负责人</div>
                </div>
              </div>
              <div class="popover-divider"></div>
              <button class="menu-item" type="button" data-action="open-account">
                <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-user"></use></svg>
                账户资料
              </button>
              <button class="menu-item" type="button" data-action="open-shortcuts">
                <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-command"></use></svg>
                键盘快捷键
              </button>
              <button class="menu-item" type="button" data-action="open-reset">
                <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-reset"></use></svg>
                恢复初始数据
              </button>
              <div class="popover-note">数据自动保存在当前浏览器</div>
            </div>
          </div>
        </div>
      </header>

      <main class="content" id="mainContent" tabindex="-1">
        <div id="app"></div>
        <footer class="app-footer">
          <span>老人言程序制作有限公司 · 内部管理台</span>
          <span>数据口径：集团合并 · 金额以人民币为基准</span>
        </footer>
      </main>
    </div>
  </div>

  <div id="overlayRoot"></div>
  <div class="toast-stack" id="toastRoot" aria-live="polite" aria-atomic="false"></div>

  <svg class="svg-sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.4"/></symbol>
    <symbol id="i-building" viewBox="0 0 24 24"><path d="M4 20.5V6.2a1.7 1.7 0 0 1 1.7-1.7h6.6A1.7 1.7 0 0 1 14 6.2v14.3"/><path d="M14 10h4.3a1.7 1.7 0 0 1 1.7 1.7v8.8"/><path d="M2.5 20.5h19"/><path d="M7 8.5h3.2M7 12h3.2M7 15.5h3.2M17 13.5h.01M17 17h.01"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.3"/><path d="M2.8 20c.5-3.6 3-5.7 6.2-5.7s5.7 2.1 6.2 5.7"/><path d="M16.2 5.1a3.3 3.3 0 0 1 0 6.2M18.3 14.6c1.8.7 2.7 2.5 2.9 5.4"/></symbol>
    <symbol id="i-transfer" viewBox="0 0 24 24"><path d="M4 8h15.5"/><path d="m15.5 4 4 4-4 4"/><path d="M20 16H4.5"/><path d="m8.5 12-4 4 4 4"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3.5 8.5 4.2L12 11.9 3.5 7.7 12 3.5Z"/><path d="m4.6 11.8 7.4 3.7 7.4-3.7"/><path d="m4.6 16 7.4 3.7 7.4-3.7"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3.5 4.5v15h17"/><path d="m6.5 15 3.4-4.2 3 2.5 4.6-6.1"/><path d="M17.5 7.2h3v3"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.2"/><path d="m15.5 15.5 4.3 4.3"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M5.2 10.2a6.8 6.8 0 0 1 13.6 0c0 4.1 1.5 5.4 2.1 6.1.3.3.1.9-.4.9H3.5c-.5 0-.7-.6-.4-.9.6-.7 2.1-2 2.1-6.1Z"/><path d="M9.5 20.2a2.8 2.8 0 0 0 5 0"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 9.5 5 5 5-5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4.5v15M4.5 12h15"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m5.5 5.5 13 13M18.5 5.5l-13 13"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M4.5 12h15"/><path d="m13.5 6 6 6-6 6"/></symbol>
    <symbol id="i-arrow-up-right" viewBox="0 0 24 24"><path d="M6 18 18 6M8 6h10v10"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3.5v11.5"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M4 20h16"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4.8 12.5 4.6 4.4L19.4 6.8"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.2M12 8h.01"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5 21 20H3L12 3.5Z"/><path d="M12 9v5M12 17h.01"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.2" r="3.7"/><path d="M4.8 20.5c.5-4 3.1-6.2 7.2-6.2s6.7 2.2 7.2 6.2"/></symbol>
    <symbol id="i-command" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 8.5h.01M15.5 8.5h.01M8.5 15.5h.01M15.5 15.5h.01M12 8v8"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3.8 10.2A8.5 8.5 0 1 1 5.2 16"/><path d="M3.5 4.5v5.8h5.8"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M7.5 3v4M16.5 3v4M3.5 10h17"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M4 7.5h13.5A2.5 2.5 0 0 1 20 10v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 18V6a2 2 0 0 1 2-2h10"/><path d="M16.5 12.5h3.5v4h-3.5a2 2 0 0 1 0-4Z"/></symbol>
    <symbol id="i-trend" viewBox="0 0 24 24"><path d="M3.5 16.5 9 11l3.5 3L20 6.5"/><path d="M15 6.5h5v5"/></symbol>
    <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 4.5v15"/><path d="m6 13.5 6 6 6-6"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3.5 5.5h17l-6.4 7.3v6.2l-4.2 1.5v-7.7L3.5 5.5Z"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3.5h7l5 5v12H6v-17Z"/><path d="M13 3.5v5h5"/><path d="M9 13h6M9 16.5h4"/></symbol>
  </svg>

  <script src="app-core.js"></script>
  <script src="app-pages.js"></script>
  <script src="app-ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
